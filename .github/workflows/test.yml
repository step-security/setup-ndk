name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm run build

      - run: git diff -aw --exit-code dist/index.js

  test-single:
    strategy:
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        ndk-version: [r21e, r26d]
        local-cache: [true, false]
        exclude:
          - os: macos-latest
            ndk-version: r21e
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./
        id: install-ndk
        with:
          ndk-version: ${{ matrix.ndk-version }}
          local-cache: ${{ matrix.local-cache }}
          link-to-sdk: true

      - run: ndk-build --version
      - run: ${{ steps.install-ndk.outputs.ndk-path }}/ndk-build --version

      - run: $ANDROID_HOME/ndk/${{ steps.install-ndk.outputs.ndk-full-version }}/ndk-build --version
        if: matrix.os != 'windows-latest'
      - run: "& $Env:ANDROID_HOME/ndk/${{ steps.install-ndk.outputs.ndk-full-version }}/ndk-build --version"
        if: matrix.os == 'windows-latest'

  test-multiple:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        local-cache: [true, false]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./
        id: install-ndk-21
        with:
          ndk-version: r21e
          add-to-path: false
          local-cache: ${{ matrix.local-cache }}
      - uses: ./
        id: install-ndk-25
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: ${{ matrix.local-cache }}

      - run: "! which ndk-build"
      - run: ${{ steps.install-ndk-21.outputs.ndk-path }}/ndk-build --version
      - run: ${{ steps.install-ndk-25.outputs.ndk-path }}/ndk-build --version
